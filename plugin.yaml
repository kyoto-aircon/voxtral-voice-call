name: voxtral-voice-call
label: Voice Calls (Twilio + Mistral Voxtral 3)
kind: platform
version: 0.1.0
description: >
  Give Hermes a Voxtral 3 voice on every voice-capable surface, no Twilio needed:
  registers a `voxtral-realtime` STT provider (batch + live streaming sessions) and a
  `voxtral-realtime` TTS provider (realtime streaming PCM over persistent pooled websockets),
  so Discord voice channels (/voice join), Desktop/CLI voice chat, and voice messages speak
  and listen with Voxtral 3 via `stt.provider` / `tts.provider`. Voice is switchable at
  runtime via `tts.voice` (full Voxtral 3 preset list with Studio-style names in
  tts_provider.py). Optionally also answers real phone calls on a Twilio number (voice-call
  platform adapter: TwiML webhook + Media Streams, per-call agent sessions, barge-in). The
  Mistral API key is read from the Hermes .env (MISTRAL_API_KEY, already templated there).
  Runs entirely as a standalone plugin - no Hermes core changes.
author: Hermes community
requires_env:
  - name: MISTRAL_API_KEY
    description: "Mistral API key for Voxtral 3 realtime transcription and TTS (template already in ~/.hermes/.env)"
    prompt: "Mistral API key"
    url: "https://console.mistral.ai/"
    password: true
optional_env:
  - name: TWILIO_ACCOUNT_SID
    description: "Twilio Account SID (only needed for the optional phone-call adapter)"
    prompt: "Twilio Account SID"
    url: "https://www.twilio.com/"
    password: false
  - name: TWILIO_AUTH_TOKEN
    description: "Twilio Auth Token (webhook signature validation; only for the phone-call adapter)"
    prompt: "Twilio Auth Token"
    password: true
  - name: TWILIO_PHONE_NUMBER
    description: "Twilio voice-capable phone number (E.164) that callers dial"
    prompt: "Twilio phone number"
    password: false
  - name: VOICE_CALL_WEBHOOK_URL
    description: "Public HTTPS URL of the voice webhook, e.g. https://example.com/webhooks/twilio/voice (set as the Twilio number's Voice URL; also used for X-Twilio-Signature validation)"
    prompt: "Public voice webhook URL"
    password: false
  - name: VOICE_CALL_WEBHOOK_HOST
    description: "Local bind host for the webhook/media-stream server (default 127.0.0.1; 0.0.0.0 behind a reverse proxy)"
    prompt: "Webhook bind host"
    password: false
  - name: VOICE_CALL_WEBHOOK_PORT
    description: "Local bind port for the webhook/media-stream server (default 8081)"
    prompt: "Webhook bind port"
    password: false
  - name: VOICE_CALL_INSECURE_NO_SIGNATURE
    description: "Set to true to skip Twilio X-Twilio-Signature validation (local development only, NOT for production)"
    prompt: "Disable signature validation (dev only)"
    password: false
  - name: VOICE_CALL_ALLOWED_NUMBERS
    description: "Comma-separated E.164 caller numbers allowed to talk to Hermes (recommended; enforced at the webhook and by gateway authz)"
    prompt: "Allowed caller numbers (comma-separated)"
    password: false
  - name: VOICE_CALL_ALLOW_ALL_USERS
    description: "Set to true to accept calls from any number"
    prompt: "Allow all callers"
    password: false
  - name: VOICE_CALL_HOME_CHANNEL
    description: "Default chat_id (call SID or phone number) for cron/notification delivery attempts"
    prompt: "Home channel"
    password: false
  - name: VOICE_CALL_CONSENT_TEXT
    description: "Optional spoken consent/recording notice played (TwiML <Say>) before the call connects to the agent"
    prompt: "Consent announcement text"
    password: false
  - name: VOICE_CALL_MAX_CALL_SECONDS
    description: "Hard cap on one call's duration in seconds, for cost control (default 1800)"
    prompt: "Max call seconds"
    password: false
  - name: VOICE_CALL_MISTRAL_BASE_URL
    description: "Mistral API base URL (default https://api.mistral.ai; use an EU endpoint for zero-retention)"
    prompt: "Mistral base URL"
    password: false
  - name: VOICE_CALL_STT_MODEL
    description: "Voxtral realtime transcription model (default voxtral-mini-transcribe-realtime-3-0)"
    prompt: "Realtime STT model"
    password: false
  - name: VOICE_CALL_STT_DELAY_MS
    description: "Realtime STT target streaming delay in ms, 80-1200 or 2400 (default 480; lower = faster, less accurate)"
    prompt: "STT streaming delay ms"
    password: false
  - name: VOICE_CALL_STT_LANGUAGE
    description: "Pin STT language as ISO 639-1 code (e.g. en); empty = auto-detect"
    prompt: "STT language"
    password: false
  - name: VOICE_CALL_STT_CONTEXT_BIAS
    description: "Comma-separated terms to bias transcription toward (names, product terms)"
    prompt: "Context bias terms"
    password: false
  - name: VOICE_CALL_TTS_MODEL
    description: "Voxtral TTS 3 model for the realtime websocket + batch endpoint (default voxtral-mini-tts-3-0)"
    prompt: "TTS 3 model"
    password: false
  - name: VOICE_CALL_TTS_VOICE
    description: "Realtime TTS voice preset (default en_paul_neutral); also settable via tts.voice - see VOXTRAL3_VOICES in tts_provider.py"
    prompt: "TTS voice preset"
    password: false
  - name: VOICE_CALL_TTS_VOICE_ID
    description: "Voxtral 3 preset voice for the batch /v1/audio/speech endpoint (default en_paul_neutral)"
    prompt: "Batch TTS voice ID"
    password: false
  - name: VOICE_CALL_TTS_SAMPLE_RATE
    description: "Realtime TTS output sample rate in Hz (default 24000); audio is resampled to 8 kHz mu-law for the phone line"
    prompt: "TTS sample rate"
    password: false
python_dependencies:
  - aiohttp>=3.9,<4
  - websockets>=12,<16
config_schema:
  mistral_api_key:
    type: secret
    env: MISTRAL_API_KEY
    label: "Mistral API key"
    description: "Voxtral 3 STT/TTS key (stored in ~/.hermes/.env as MISTRAL_API_KEY)"
    required: true
  mistral_base_url:
    type: str
    default: "https://api.mistral.ai"
    label: "Mistral base URL"
    description: "Use an EU endpoint for zero-retention"
  stt_model:
    type: str
    default: "voxtral-mini-transcribe-realtime-3-0"
    label: "Realtime STT model"
  stt_delay_ms:
    type: int
    default: 480
    label: "STT streaming delay (ms)"
    description: "80-1200 or 2400; lower is faster, less accurate"
  stt_language:
    type: str
    default: ""
    label: "STT language"
    description: "ISO 639-1 code (e.g. en); empty = auto-detect"
  stt_context_bias:
    type: str
    default: ""
    label: "STT context bias"
    description: "Comma-separated terms to bias transcription toward"
  tts_model:
    type: str
    default: "voxtral-mini-tts-3-0"
    label: "TTS 3 model"
    description: "Used for both the realtime websocket and batch endpoint"
  tts_voice:
    type: str
    default: "en_paul_neutral (Paul, neutral en)"
    label: "Voice"
    description: "Voxtral 3 preset voice (Studio-style name); raw ids also accepted; one persistent websocket is kept per voice"
    choices: ["en_paul_neutral (Paul, neutral en)", "en_paul_happy (Paul, happy en)", "en_paul_confident (Paul, confident en)", "gb_jane_neutral (Jane, neutral en-GB)", "gb_oliver_neutral (Oliver, neutral en-GB)", "fr_marie_neutral (Marie, neutral fr)", "James (en-US)", "Margaret (en-US)", "Rob (en-US)", "Sheila (en-US)", "David (en-GB)", "Fred (en-GB)", "Harriet (en-GB)", "Howard (en-GB)", "Hugo (en-GB)", "Mary (en-GB)", "Sky (en-GB)", "Elena (es)", "Camille (fr)", "Lea (fr)", "Manon (fr)", "Marie (fr)", "Ananya (hi)", "Himanshu (hi)", "Olivia (hu)", "Lorenzo (it)", "Haruto (ja)", "Jin (ko)", "Sung (ko)", "Lotte (nl)", "Lars (no)", "Leon (pl)", "Gabriela (pt)", "Irina (ro)", "Tatiana (ru)", "Oran (tr)", "Taras (uk)", "Huong (vi)", "Mei (zh)", "Maryam (ar)", "Jordi (ca)", "Heidi (de)"]
  tts_voice_id:
    type: str
    default: "en_paul_neutral"
    label: "Batch TTS voice ID"
    description: "Preset voice for the batch /v1/audio/speech endpoint"
  tts_sample_rate:
    type: int
    default: 24000
    label: "TTS sample rate (Hz)"
  turn_detection:
    type: dict
    default: {}
    label: "STT turn detection overrides"
    description: "Empty = server defaults (start/end thresholds, min_silence_ms, end_timeout_ms)"
  webhook_host:
    type: str
    default: "127.0.0.1"
    label: "Webhook bind host"
  webhook_port:
    type: int
    default: 8081
    label: "Webhook bind port"
  webhook_url:
    type: str
    default: ""
    label: "Public voice webhook URL"
    description: "https://your-host/webhooks/twilio/voice (Twilio adapter only; also validates X-Twilio-Signature)"
  insecure_no_signature:
    type: bool
    default: false
    label: "Disable Twilio signature validation"
    description: "Local development only — never in production"
  allowed_numbers:
    type: str
    default: ""
    label: "Allowed caller numbers"
    description: "Comma-separated E.164 numbers allowed to call (Twilio adapter only)"
  allow_all:
    type: bool
    default: false
    label: "Allow all callers"
  consent_text:
    type: str
    default: ""
    label: "Consent announcement"
    description: "Spoken (TwiML <Say>) before connecting a call"
  max_call_seconds:
    type: int
    default: 1800
    label: "Max call seconds"
    description: "Hard cap per call, for cost control"
  twilio_account_sid:
    type: secret
    env: TWILIO_ACCOUNT_SID
    label: "Twilio Account SID"
    description: "Optional phone-call adapter only (stored in ~/.hermes/.env)"
  twilio_auth_token:
    type: secret
    env: TWILIO_AUTH_TOKEN
    label: "Twilio Auth Token"
  twilio_phone_number:
    type: secret
    env: TWILIO_PHONE_NUMBER
    label: "Twilio phone number"
    description: "Voice-capable E.164 number callers dial (optional phone-call adapter)"
