name: voxtral-voice-call
label: Voice Calls (Twilio + Mistral Voxtral 3)
kind: platform
version: 0.1.0
description: >
  Give Hermes a Voxtral 3 voice on every voice-capable surface, no Twilio needed:
  registers a `voxtral-realtime` STT provider (batch + live streaming sessions) and a
  `voxtral-realtime` TTS provider (realtime streaming PCM), so Discord voice channels
  (/voice join), Desktop/CLI voice chat, and voice messages speak and listen with Voxtral 3
  via `stt.provider` / `tts.provider`. Optionally also answers real phone calls on a Twilio
  number (voice-call platform adapter: TwiML webhook + Media Streams, per-call agent
  sessions, barge-in). The Mistral API key is read from the Hermes .env (MISTRAL_API_KEY,
  already templated there). Runs entirely as a standalone plugin - no Hermes core changes.
author: Hermes community
requires_env:
  - name: MISTRAL_API_KEY
    description: "Mistral API key for Voxtral 3 realtime transcription and TTS (template already in ~/.hermes/.env)"
    prompt: "Mistral API key"
    url: "https://console.mistral.ai/"
    password: true
optional_env:
  - name: TWILIO_ACCOUNT_SID
    description: "Twilio Account SID (only needed for the optional phone-call adapter)"
    prompt: "Twilio Account SID"
    url: "https://www.twilio.com/"
    password: false
  - name: TWILIO_AUTH_TOKEN
    description: "Twilio Auth Token (webhook signature validation; only for the phone-call adapter)"
    prompt: "Twilio Auth Token"
    password: true
  - name: TWILIO_PHONE_NUMBER
    description: "Twilio voice-capable phone number (E.164) that callers dial"
    prompt: "Twilio phone number"
    password: false
  - name: VOICE_CALL_WEBHOOK_URL
    description: "Public HTTPS URL of the voice webhook, e.g. https://example.com/webhooks/twilio/voice (set as the Twilio number's Voice URL; also used for X-Twilio-Signature validation)"
    prompt: "Public voice webhook URL"
    password: false
  - name: VOICE_CALL_WEBHOOK_HOST
    description: "Local bind host for the webhook/media-stream server (default 127.0.0.1; 0.0.0.0 behind a reverse proxy)"
    prompt: "Webhook bind host"
    password: false
  - name: VOICE_CALL_WEBHOOK_PORT
    description: "Local bind port for the webhook/media-stream server (default 8081)"
    prompt: "Webhook bind port"
    password: false
  - name: VOICE_CALL_INSECURE_NO_SIGNATURE
    description: "Set to true to skip Twilio X-Twilio-Signature validation (local development only, NOT for production)"
    prompt: "Disable signature validation (dev only)"
    password: false
  - name: VOICE_CALL_ALLOWED_NUMBERS
    description: "Comma-separated E.164 caller numbers allowed to talk to Hermes (recommended; enforced at the webhook and by gateway authz)"
    prompt: "Allowed caller numbers (comma-separated)"
    password: false
  - name: VOICE_CALL_ALLOW_ALL_USERS
    description: "Set to true to accept calls from any number"
    prompt: "Allow all callers"
    password: false
  - name: VOICE_CALL_HOME_CHANNEL
    description: "Default chat_id (call SID or phone number) for cron/notification delivery attempts"
    prompt: "Home channel"
    password: false
  - name: VOICE_CALL_CONSENT_TEXT
    description: "Optional spoken consent/recording notice played (TwiML <Say>) before the call connects to the agent"
    prompt: "Consent announcement text"
    password: false
  - name: VOICE_CALL_MAX_CALL_SECONDS
    description: "Hard cap on one call's duration in seconds, for cost control (default 1800)"
    prompt: "Max call seconds"
    password: false
  - name: VOICE_CALL_MISTRAL_BASE_URL
    description: "Mistral API base URL (default https://api.mistral.ai; use an EU endpoint for zero-retention)"
    prompt: "Mistral base URL"
    password: false
  - name: VOICE_CALL_STT_MODEL
    description: "Voxtral realtime transcription model (default voxtral-mini-transcribe-realtime-3-0)"
    prompt: "Realtime STT model"
    password: false
  - name: VOICE_CALL_STT_DELAY_MS
    description: "Realtime STT target streaming delay in ms, 80-1200 or 2400 (default 480; lower = faster, less accurate)"
    prompt: "STT streaming delay ms"
    password: false
  - name: VOICE_CALL_STT_LANGUAGE
    description: "Pin STT language as ISO 639-1 code (e.g. en); empty = auto-detect"
    prompt: "STT language"
    password: false
  - name: VOICE_CALL_STT_CONTEXT_BIAS
    description: "Comma-separated terms to bias transcription toward (names, product terms)"
    prompt: "Context bias terms"
    password: false
  - name: VOICE_CALL_TTS_MODEL
    description: "Voxtral realtime TTS model (default voxtral-mini-tts-realtime-3)"
    prompt: "Realtime TTS model"
    password: false
  - name: VOICE_CALL_TTS_VOICE
    description: "Realtime TTS voice name (default en_paul_neutral); used by the streaming path and settable via tts.voice"
    prompt: "Realtime TTS voice"
    password: false
  - name: VOICE_CALL_TTS_VOICE_ID
    description: "Voice ID for the batch /v1/audio/speech endpoint (default Paul neutral UUID)"
    prompt: "Batch TTS voice ID"
    password: false
  - name: VOICE_CALL_TTS_SAMPLE_RATE
    description: "Realtime TTS output sample rate in Hz (default 24000); audio is resampled to 8 kHz mu-law for the phone line"
    prompt: "TTS sample rate"
    password: false
python_dependencies:
  - aiohttp
  - websockets
